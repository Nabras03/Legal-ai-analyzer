# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec).
# The frontend is deployed separately on Vercel.
services:
  - type: web
    name: legal-ai-analyzer-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: GEMINI_API_KEY
        sync: false   # entered in the Render dashboard, never committed
      - key: ALLOWED_ORIGINS
        sync: false   # the Vercel URL, e.g. https://legal-ai-analyzer.vercel.app
